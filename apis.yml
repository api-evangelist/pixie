apis:
- aid: pixie:pixie-pxl-api
  name: Pixie PxL Script API
  description: >-
    Python-dialect domain-specific language and API for querying and analyzing telemetry data collected
    by Pixie within a Kubernetes cluster. PxL scripts allow developers to filter, aggregate, and visualize
    metrics, traces, and full-body request data collected via eBPF.
  humanURL: https://docs.px.dev/reference/pxl/
  tags:
  - eBPF
  - Kubernetes
  - Metrics
  - Observability
  - Scripting
  properties:
  - type: Documentation
    url: https://docs.px.dev/reference/pxl/
  - type: Reference
    url: https://docs.px.dev/reference/pxl/
  - type: JSONSchema
    url: json-schema/pixie-pxl-script-schema.json
- aid: pixie:pixie-plugin-api
  name: Pixie Plugin System API
  description: >-
    Plugin API that allows configuring PxL scripts to export observability data from Pixie at regularly
    scheduled intervals to external systems. Supports integrations including a Grafana datasource plugin
    for visualizing Pixie data in Grafana dashboards.
  humanURL: https://docs.px.dev/reference/plugins/plugin-system/
  tags:
  - Grafana
  - Integrations
  - Kubernetes
  - Observability
  - Plugins
  properties:
  - type: Documentation
