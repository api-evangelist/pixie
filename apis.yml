aid: pixie
name: Pixie
description: >-
  Pixie is a Kubernetes observability platform that uses eBPF to automatically collect telemetry data including
  full-body application requests, resource and network metrics, and application profiles without manual instrumentation.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
